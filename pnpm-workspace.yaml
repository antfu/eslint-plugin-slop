ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/eslint-config@9.4.1'
  - eslint-plugin-pnpm@1.9.1
  - pnpm-workspace-yaml@1.9.1

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.4.1
    '@antfu/ni': ^30.5.0
    '@typescript-eslint/utils': ^8.69.0
    bumpp: ^12.2.2
    eslint: ^10.9.1
    jiti: ^2.7.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    typescript: ^6.0.3
  deps:
    diff: ^9.0.0
  testing:
    '@eslint/markdown': ^8.0.3
    '@typescript-eslint/parser': ^8.69.0
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.4.0
    vitest: ^4.1.11
  types:
    '@types/node': ^26.4.0
